<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Practice Partner</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        .chat-card { 
            background: white; 
            width: 100%; 
            max-width: 450px; 
            border-radius: 15px; 
            padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        
        .topic-container { margin-bottom: 15px; }
        label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        select { 
            width: 100%; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            font-size: 15px; 
            background: #fff;
        }

        .status { text-align: center; color: #666; font-size: 14px; margin-bottom: 15px; }
        .box { 
            background: #f8f9fa; 
            border-left: 4px solid #1a73e8; 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 6px; 
            font-size: 15px; 
        }
        .feedback { background: #fff3cd; border-left: 4px solid #ffc107; color: #856404; }
        .ai-box { background: #e8f0fe; border-left: 4px solid #34a853; color: #174ea6; }
        .btn { 
            background: #1a73e8; 
            color: white; 
            border: none; 
            padding: 15px; 
            font-size: 16px; 
            border-radius: 30px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn:disabled { background: #a0c3ff; }
    </style>
</head>
<body>

<div class="chat-card">
    <h2>🗣️ AI English Tutor</h2>
    
    <!-- Topic Selection Dropdown -->
    <div class="topic-container">
        <label for="topic-select">🎯 Select Practice Topic:</label>
        <select id="topic-select">
            <option value="Casual Daily Conversation">💬 Casual Chat</option>
            <option value="Job Interview Practice">💼 Job Interview</option>
            <option value="Ordering Food at a Restaurant">🍕 Restaurant Ordering</option>
            <option value="At the Airport & Travel">✈️ Travel & Airport</option>
            <option value="Shopping & Asking Prices">🛍️ Shopping Chat</option>
        </select>
    </div>

    <div id="status" class="status">Tap the button and speak in English</div>

    <div class="box">
        <strong>You Said:</strong>
        <div id="user-text">...</div>
    </div>

    <div class="box feedback">
        <strong>Grammar Correction:</strong>
        <div id="grammar-text">...</div>
    </div>

    <div class="box ai-box">
        <strong>AI Response:</strong>
        <div id="ai-response">...</div>
    </div>

    <button id="talk-btn" class="btn">🎤 Start Speaking</button>
</div>

<script>
    // ⚠️ अपनी Google Gemini API Key यहाँ डालें
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; 

    const talkBtn = document.getElementById('talk-btn');
    const topicSelect = document.getElementById('topic-select');
    const userText = document.getElementById('user-text');
    const grammarText = document.getElementById('grammar-text');
    const aiResponse = document.getElementById('ai-response');
    const statusText = document.getElementById('status');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        talkBtn.addEventListener('click', () => {
            recognition.start();
            statusText.innerText = "Listening... Speak now";
            talkBtn.innerText = "Listening...";
            talkBtn.disabled = true;
        });

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            userText.innerText = transcript;
            statusText.innerText = "AI is thinking & analyzing grammar...";

            const selectedTopic = topicSelect.value;
            await fetchAIResponse(transcript, selectedTopic);

            talkBtn.innerText = "🎤 Start Speaking";
            talkBtn.disabled = false;
            statusText.innerText = "Tap button to continue conversation";
        };

        recognition.onerror = (e) => {
            alert("Speech recognition error: " + e.error);
            talkBtn.innerText = "🎤 Start Speaking";
            talkBtn.disabled = false;
            statusText.innerText = "Try again";
        };
    } else {
        alert("Please use Google Chrome browser on mobile.");
    }

    async function fetchAIResponse(userPrompt, topic) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
        
        const systemInstruction = `You are an English speaking tutor. The current conversation context is: "${topic}". 
        Roleplay according to this topic (e.g., if topic is Interview, act like an interviewer).
        Analyze the user's input and reply strictly in JSON format with two keys:
        1. "correction": If there are grammar mistakes, correct them simply. If perfect, write "Perfect sentence!".
        2. "reply": A natural, friendly 1-2 sentence roleplay response in English to keep the topic going.`;

        const requestBody = {
            contents: [{
                parts: [{ text: `${systemInstruction}\n\nUser said: "${userPrompt}"` }]
            }],
            generationConfig: { responseMimeType: "application/json" }
        };

        try {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await res.json();
            const resultText = data.candidates[0].content.parts[0].text;
            const parsedData = JSON.parse(resultText);

            grammarText.innerText = parsedData.correction;
            aiResponse.innerText = parsedData.reply;

            speakText(parsedData.reply);

        } catch (error) {
            console.error(error);
            aiResponse.innerText = "Error connecting to AI. Check your API key.";
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
